name: CI — realsass-dashboard-front

on:
  push:
    paths:
      - 'realsass-dashboard-front/**'
      - 'packages/**'
      - 'pnpm-workspace.yaml'
      - 'package.json'
  pull_request:
    branches: [main]
    paths:
      - 'realsass-dashboard-front/**'
      - 'packages/**'

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '10' }
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Contratos tRPC (ADR-019)
        run: pnpm contracts
      - run: pnpm --filter realsass-dashboard-front typecheck
      - run: pnpm --filter realsass-dashboard-front lint
      - run: pnpm --filter realsass-dashboard-front build
