name: CI — realsass-ecommerce-back

on:
  push:
    paths:
      - 'realsass-ecommerce-back/**'
      - 'packages/**'
      - 'pnpm-workspace.yaml'
      - 'package.json'
  pull_request:
    branches: [main]
    paths:
      - 'realsass-ecommerce-back/**'
      - 'packages/**'

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '10' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter realsass-ecommerce-back typecheck
      - run: pnpm --filter realsass-ecommerce-back lint
      - run: pnpm --filter realsass-ecommerce-back test:cov
        env: { CI: true }
      - run: pnpm --filter realsass-ecommerce-back build
