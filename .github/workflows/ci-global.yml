name: CI — global

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  global:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '10' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "@real/trpc" typecheck
      - run: pnpm --filter "@real/auth-client" typecheck
      - run: pnpm --filter "@real/auth-server" typecheck
