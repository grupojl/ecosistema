name: CI — tRPC contract gate

on:
  push:
    paths:
      - 'realsass-sass-back/src/trpc/**'
      - 'realsass-ecommerce-back/src/trpc/**'
      - 'packages/trpc/**'
  pull_request:
    branches: [main]
    paths:
      - 'realsass-sass-back/src/trpc/**'
      - 'realsass-ecommerce-back/src/trpc/**'
      - 'packages/trpc/**'

jobs:
  typecheck-fronts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        front: [realsass-sass-front, realsass-dashboard-front, real-ecommerce-front]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '10' }
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Contratos tRPC (ADR-019)
        run: pnpm contracts
      - run: pnpm --filter ${{ matrix.front }} typecheck
