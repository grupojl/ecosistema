name: real-ecommerce-front

on:
  push:
    branches: [main]
    paths:
      - 'real-ecommerce-front/**'
      - 'packages/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'tsconfig.base.json'
  pull_request:
    branches: [main]
    paths:
      - 'real-ecommerce-front/**'
      - 'packages/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'tsconfig.base.json'

jobs:
  ci:
    name: typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Contratos tRPC (ADR-019)
        run: pnpm contracts

      - name: Typecheck
        run: pnpm --filter real-ecommerce-front typecheck

      - name: Build
        run: pnpm --filter real-ecommerce-front build
        env:
          NEXT_PUBLIC_ECOMMERCE_API_URL: http://localhost:3005/api/v1
          NEXT_PUBLIC_SASS_BACK_URL: http://localhost:3000
          SITE_URL: http://localhost:3003
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-dummy
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-project
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:000000000000:web:ci

      - name: Audit
        run: pnpm --filter real-ecommerce-front audit --audit-level=high
        continue-on-error: false
