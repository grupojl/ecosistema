# trpc-contract.yml
# Corre typecheck de los 3 fronts cuando cambia un router tRPC.
# Si un procedure cambia y rompe un front, el PR no puede mergearse.
name: trpc-contract

on:
  push:
    branches: [main]
    paths:
      - 'realsass-sass-back/src/trpc/**'
      - 'realsass-ecommerce-back/src/trpc/**'
      - 'packages/trpc/**'
  pull_request:
    branches: [main]
    paths:
      - 'realsass-sass-back/src/trpc/**'
      - 'realsass-ecommerce-back/src/trpc/**'
      - 'packages/trpc/**'

jobs:
  contract-check:
    name: typecheck fronts (contrato tRPC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Contratos tRPC (ADR-019)
        run: pnpm contracts

      - name: Typecheck realsass-sass-front
        run: pnpm --filter realsass-sass-front typecheck

      - name: Typecheck realsass-dashboard-front
        run: pnpm --filter realsass-dashboard-front typecheck

      - name: Typecheck real-ecommerce-front
        run: pnpm --filter real-ecommerce-front typecheck
