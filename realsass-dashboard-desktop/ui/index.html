<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Welver Dashboard</title>
    <style>
      :root { color-scheme: dark light; }
      body {
        margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #0a0a0a; color: #f5f5f5;
      }
      .spinner {
        width: 28px; height: 28px; border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.15); border-top-color: #3b82f6; animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      #msg { margin: 0; font-size: 14px; color: #a3a3a3; text-align: center; max-width: 320px; }
    </style>
  </head>
  <body>
    <!-- Sin JavaScript: la app (Rust) actualiza #msg y navega al panel. Así la CSP puede ser estricta. -->
    <div class="spinner" aria-hidden="true"></div>
    <p id="msg">Conectando con el panel…</p>
  </body>
</html>
