[variables]
NIXPACKS_NODE_VERSION = "20"
NODE_ENV = "production"
HOSTNAME = "0.0.0.0"
PORT = "3000"

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = [
  "corepack enable",
  "corepack prepare pnpm@9.15.9 --activate",
  "pnpm install --no-frozen-lockfile"
]

[phases.build]
cmds = ["pnpm run build"]

# standalone genera: .next/standalone/server.js
# hay que copiar static files manualmente al directorio standalone
[phases.postbuild]
cmds = [
  "cp -r .next/static .next/standalone/.next/static",
  "cp -r public .next/standalone/public"
]

[start]
cmd = "node .next/standalone/server.js"
